name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:        # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write           # nécessaire pour publier une release sur tag

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Gradle (+ cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'   # utilisé seulement si le wrapper est absent du dépôt

      - name: Keystore de signature (optionnel)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests unitaires + compilation debug et release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            GRADLE=./gradlew
          else
            GRADLE=gradle
          fi
          $GRADLE --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease

      - name: Renommer les APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk     dist/QrStream-${{ github.run_number }}-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/QrStream-${{ github.run_number }}.apk
          ls -lh dist

      - name: Rapport de tests (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: app/build/reports/
          if-no-files-found: ignore

      - name: Publier les APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: QrStream-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30

      - name: Créer une release GitHub (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
